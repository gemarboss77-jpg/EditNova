name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # This repo's own gradle-wrapper.jar could not be generated in the sandboxed dev
      # environment that prepared it (no network access to download the real binary
      # from services.gradle.org). This step installs a real Gradle 8.7 and uses it to
      # regenerate the complete wrapper (scripts + jar) here on the runner, which DOES
      # have network access — so the ./gradlew used below is a genuine, working wrapper,
      # not just the hand-written gradlew/gradlew.bat scripts already committed to the repo.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Regenerate Gradle Wrapper (fills in the missing gradle-wrapper.jar)
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EditNova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
